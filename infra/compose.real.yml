# The REAL environment: router -> Ollama juniors on the Mac, Claude Opus 5.5 senior, MLServer policy.
# Use with:  docker compose -f docker-compose.yml -f infra/compose.real.yml --profile policy up ...
# (make real-up). The base file keeps the mocks as defaults so tests and S1-S3 never call a
# paid API. SENIOR_API_KEY still comes from .env and is never written here.
services:
  router:
    environment:
      JUNIOR1_URL: http://host.docker.internal:11434
      JUNIOR1_MODEL: gemma3:12b          # ADR-7, Experiment 1
      JUNIOR2_URL: http://host.docker.internal:11434
      JUNIOR2_MODEL: phi4:14b
      SENIOR_PROVIDER: anthropic
      SENIOR_URL: https://api.anthropic.com/v1/messages
      SENIOR_MODEL: claude-opus-5-5
      SENIOR_PRICE_IN: "4"               # USD per million tokens, pricing page 10 Nov 2026
      SENIOR_PRICE_OUT: "20"
      POLICY_URL: http://policy-server:8080

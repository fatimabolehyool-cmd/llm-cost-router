# Prometheus (interface I10): pull /metrics from the router and MLServer every 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/rules.yml"]

scrape_configs:
  - job_name: router
    metrics_path: /metrics
    static_configs: [{ targets: ["router:8000"] }]
  - job_name: policy-server            # MLServer's built-in metrics port
    metrics_path: /metrics
    static_configs: [{ targets: ["policy-server:8082"] }]
